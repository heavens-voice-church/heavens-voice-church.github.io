<!doctype html>
<!--
  Source for the Open Graph share images (1200x630).
  Regenerate:
    google-chrome --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=public/og-image.png "file://$PWD/scripts/og-image.html"
    google-chrome --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=public/og-bible-ai.png "file://$PWD/scripts/og-image.html#ai"
-->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=block" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Pretendard', sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #0f172a 0%, #082f49 55%, #0f172a 100%);
    position: relative;
  }
  .glow1 { position: absolute; top: -160px; right: -120px; width: 560px; height: 560px; border-radius: 50%; background: rgba(14,165,233,.28); filter: blur(90px); }
  .glow2 { position: absolute; bottom: -200px; left: -140px; width: 520px; height: 520px; border-radius: 50%; background: rgba(56,189,248,.14); filter: blur(90px); }
  /* All content stays inside the centered 630px square so messengers that crop to 1:1 (e.g. KakaoTalk mobile) still show everything */
  .wrap { position: relative; height: 100%; width: 600px; margin: 0 auto; padding: 46px 0 40px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 52px; height: 52px; }
  .brand .ko { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; text-align: left; }
  .brand .en { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #94a3b8; margin-top: 1px; text-align: left; }
  .pill { display: inline-block; padding: 7px 16px; border-radius: 999px; background: rgba(14,165,233,.15); border: 1px solid rgba(125,211,252,.4); color: #7dd3fc; font-size: 17px; font-weight: 700; }
  h1 { font-family: 'Noto Serif KR', serif; font-weight: 700; letter-spacing: -0.04em; line-height: 1.25; margin-top: 18px; }
  h1 .l1 { font-size: 50px; display: block; }
  h1 .l2 { font-size: 46px; color: #38bdf8; display: block; }
  .sub { margin-top: 16px; font-size: 20px; line-height: 1.5; color: #cbd5e1; font-weight: 400; }
  .foot { width: 100%; border-top: 1px solid rgba(255,255,255,.15); padding-top: 18px; font-size: 18px; line-height: 1.6; color: #cbd5e1; }
  .foot b { color: #fff; font-weight: 700; }
  .domain { color: #7dd3fc; font-weight: 700; }
  .ai { display: none; }
  body.is-ai .home { display: none; }
  body.is-ai .ai { display: block; }
</style>
</head>
<body>
  <div class="glow1"></div><div class="glow2"></div>
  <div class="wrap">
    <div class="brand">
      <img src="../public/favicon.svg" alt="" />
      <div>
        <div class="ko">하늘소리교회</div>
        <div class="en">Heaven's Voice Church</div>
      </div>
    </div>

    <div class="home">
      <span class="pill">기독교대한복음교회 · 김포 하늘소리교회</span>
      <h1><span class="l1">은혜의 50년</span><span class="l2">"하늘소리, 세상의 빛이어라"</span></h1>
      <p class="sub">고막리에서 들려오는 아름다운 복음의 소리,<br />하늘소리교회에 여러분을 초대합니다.</p>
    </div>

    <div class="ai">
      <span class="pill">하늘소리교회 · 성경 말씀 추천</span>
      <h1><span class="l1">지금 내 마음에 필요한</span><span class="l2">성경 말씀을 찾아 드립니다</span></h1>
      <p class="sub">고민과 기도 제목을 적으면<br />위로와 힘이 되는 말씀을 추천해드립니다.</p>
    </div>

    <div class="foot">
      <div><b>주일 예배</b> 오전 11:00 · 오후 01:30 &nbsp;|&nbsp; 김포시 용강로 100</div>
      <div class="domain">heavensvoicechurch.com</div>
    </div>
  </div>
  <script>if (location.hash === '#ai') document.body.classList.add('is-ai');</script>
</body>
</html>
